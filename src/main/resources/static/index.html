<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LlamaCpp Handler</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>LlamaCpp Handler</h1>
        <p>A UI-wrapper to start LLM locally using llama.cpp server</p>
    </div>

    <div class="main">
        <div class="content-section">
            <h2>Currently running</h2>
            <div id="currently-running">None.</div>
        </div>

        <div class="content-section">
            <h2>Available models</h2>
            <div id="available-models">None.</div>
        </div>

        <div class="content-section">
            <h2 id="current-action-name">Active action</h2>
            <div id="current-action">
                <p>Ensure you've upload the proper models and set up the application.properties before start.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
